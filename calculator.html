<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nutrition Plan - Diet Target & Meal Plan</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Top Navigation Header -->
  <nav class="navbar">
    <div class="logo">🥗 Nutrition Plan</div>
    <ul class="nav-links">
      <li><a href="index.html">Daily Dashboard</a></li>
      <li><a href="records.html">Food Intake Log</a></li>
      <li><a href="calculator.html" class="active">Diet Calculator</a></li>
    </ul>
  </nav>

  <div class="container">
    <!-- Notification Feedback Box -->
    <div id="alertBox" class="alert"></div>

    <!-- Main Calculator Card -->
    <div class="calc-page-header">
      <h2>🎯 Personalized Nutrition & Diet Goal</h2>
      <p>Calculate your daily energy expenditure and generate a tailored 4-meal plan based on your monthly objective.</p>
    </div>

    <div class="calc-card-wrapper">
      <!-- Section 1: Biometric Inputs -->
      <div class="calc-form-section">
        <h3 class="calc-section-title">👤 Personal Profile</h3>
        
        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="calc-row-3">
          <div class="form-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="e.g. 78" min="30" max="250">
          </div>
          <div class="form-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="e.g. 178" min="100" max="250">
          </div>
          <div class="form-group">
            <label for="age">Age (years)</label>
            <input type="number" id="age" placeholder="e.g. 19" min="12" max="100">
          </div>
        </div>

        <div class="form-group">
          <label for="activityLevel">Daily Activity Level</label>
          <select id="activityLevel">
            <option value="1.2">Sedentary (Little or no exercise, desk study/work)</option>
            <option value="1.375">Lightly Active (Light exercise 1-3 days/week)</option>
            <option value="1.55">Moderately Active (Moderate exercise 3-5 days/week)</option>
            <option value="1.725">Very Active (Hard training 6-7 days/week)</option>
          </select>
        </div>
      </div>

      <!-- Section 2: Target Goal Selection -->
      <div class="calc-form-section">
        <h3 class="calc-section-title">⚖️ 1-Month Target Goal</h3>
        <div class="form-group">
          <label for="dietGoal">Choose Monthly Objective</label>
          <select id="dietGoal">
            <option value="lose_500g">Weight Loss: -500g / month (-130 kcal/day deficit)</option>
            <option value="stay">Weight Maintenance: Stay / Maintain (0 kcal offset)</option>
            <option value="gain_500g">Weight Gain: +500g / month (+130 kcal/day surplus)</option>
          </select>
        </div>

        <button id="btnCalculate" class="btn-calculate-primary">
          Generate Target & 4-Meal Plan
        </button>
      </div>
    </div>

    <!-- Output Container: Assessment & 4-Meal Recommendations -->
    <div id="calcAndSuggestionResult"></div>
  </div>

  <script src="js/calculator.js"></script>
</body>
</html>
